name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.2"
                  cache: true

            - name: Download dependencies
              run: go mod download

            - name: Run tests
              run: go test ./...

    build-custom-binary:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.2"
                  cache: true

            - name: Install golangci-lint
              run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1

            - name: Build custom binary
              run: golangci-lint custom
